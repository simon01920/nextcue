<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NextCue: track every show and movie you watch, with a VHS shelf for your collection.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <!-- Open the API and artwork connections while the engine downloads. -->
  <link rel="preconnect" href="https://api4.thetvdb.com" crossorigin>
  <link rel="preconnect" href="https://artworks.thetvdb.com">
  <link rel="preconnect" href="https://graphql.anilist.co" crossorigin>
  <link rel="preconnect" href="https://s4.anilist.co">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NextCue">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NextCue - TV and Movie Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#000000">
  <!-- Shown until Flutter paints its first frame, instead of a blank page. -->
  <div id="nc-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000000;color:#fff;font:600 20px system-ui,sans-serif;letter-spacing:.08em;transition:opacity .25s">NEXTCUE</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('nc-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
