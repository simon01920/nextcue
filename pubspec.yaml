name: showtrack
description: "NextCue — TV and movie tracker built with Flutter (Android, iOS, Web)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0" # Flutter 3.29+: BackdropFilter.grouped

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  crypto: ^3.0.5
  cloud_firestore: ^5.4.4
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/animations/
    - assets/plates/
    - assets/plates/shelf/
    - assets/plates/hero/

  shaders:
    - shaders/plate.frag

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Light.ttf
          weight: 300
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
          weight: 400
